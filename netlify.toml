# ──────────────────────────────────────────────────────────────
# HeySystem — Netlify configuration
# ──────────────────────────────────────────────────────────────
# Static site (index.html) + serverless functions for Figma API.

[build]
  # Nada para fazer build: deploys o repo as-is.
  publish = "."
  functions = "netlify/functions"

# ──────────────────────────────────────────────────────────────
# Headers — security best practices
# ──────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permite Bootstrap + Google Fonts CDN (já usadas no index.html)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://api.figma.com;"

# ──────────────────────────────────────────────────────────────
# Redirect — endpoint mais limpo para a function
# ──────────────────────────────────────────────────────────────
# Em vez de /.netlify/functions/analyze, o frontend pode chamar /api/analyze
[[redirects]]
  from = "/api/analyze"
  to = "/.netlify/functions/analyze"
  status = 200
